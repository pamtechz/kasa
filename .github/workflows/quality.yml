name: Quality checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kasa-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Hosted, ephemeral runner: tests cannot be held indefinitely by KASAINSTITUTE downtime.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Source-level security tests have zero external dependencies: fail fast.
      - name: Run security boundary checks
        run: node --test scripts/tests/security-boundaries.test.mjs

      # The remaining tests import PDF libraries: install locked dependencies first.
      # npm ci fails on an inconsistent lockfile instead of silently rewriting it.
      - name: Check npm registry access
        run: |
          npm config get registry
          npm ping --fetch-retries=0 --fetch-timeout=15000

      - name: Install locked dependencies
        timeout-minutes: 25
        run: npm ci --no-audit --no-fund --prefer-offline --fetch-retries=1 --fetch-timeout=60000

      - name: Run source tests
        run: npm run test:source

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
