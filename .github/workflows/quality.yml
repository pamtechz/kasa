name: Quality checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: kasa-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The KASA runner is Windows x64. Always use eligible self-hosted hardware.
    # Do not execute untrusted fork PR code on a persistent self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    # Windows PowerShell 5.1 is installed on the runner; pwsh 7 is not.
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Tests import PDF libraries: install all locked dependencies first.
      # npm ci fails on an inconsistent lockfile instead of silently rewriting it.
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run source tests
        run: npm run test:source

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Production build
        run: npm run build
