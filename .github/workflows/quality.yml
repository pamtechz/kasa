name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    # Use an eligible self-hosted runner. The runner NAME KASAINSTITUTE is not automatically a custom label.
    # Repository admins may add a KASAINSTITUTE custom label if they want stricter pinning.
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '22'}
      - run: npm run test:source
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
