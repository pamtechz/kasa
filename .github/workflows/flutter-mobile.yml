name: Flutter mobile verification
on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android --project-name kasa_mobile .
      - name: Install Flutter packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=KASA_PORTAL_URL=https://kasaschool.vercel.app
      - uses: actions/upload-artifact@v4
        with:
          name: kasa-mobile-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
