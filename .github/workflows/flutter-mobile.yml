name: Flutter mobile verification
on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android --org com.pamtech --project-name kasa_mobile .
      - name: Configure Android permissions and package
        run: dart run tool/configure_android.dart
      - name: Verify exact Android package identity
        run: |
          grep -q 'applicationId = "com.pamtech.kasa"' android/app/build.gradle.kts
          grep -q 'namespace = "com.pamtech.kasa"' android/app/build.gradle.kts
          grep -q '^package com.pamtech.kasa$' android/app/src/main/kotlin/com/pamtech/kasa/MainActivity.kt
      - name: Exercise native Firebase wiring with synthetic config only
        run: |
          set -euo pipefail
          cp android/app/build.gradle.kts /tmp/kasa-build.gradle.kts
          cp android/settings.gradle.kts /tmp/kasa-settings.gradle.kts
          trap 'rm -f android/app/google-services.json; cp /tmp/kasa-build.gradle.kts android/app/build.gradle.kts; cp /tmp/kasa-settings.gradle.kts android/settings.gradle.kts' EXIT
          cat > android/app/google-services.json <<'JSON'
          {"project_info":{"project_id":"kasa-ci-fixture"},"client":[{"client_info":{"android_client_info":{"package_name":"com.pamtech.kasa"}}}]}
          JSON
          KASA_REQUIRE_NATIVE_FIREBASE=1 KASA_FIREBASE_PROJECT_ID=kasa-ci-fixture dart run tool/configure_android.dart
          grep -q 'id("com.google.gms.google-services")' android/app/build.gradle.kts
          grep -Fqx '    id("com.google.gms.google-services") version "4.5.0" apply false' android/settings.gradle.kts
          grep -Fqx '    id("com.google.gms.google-services")' android/app/build.gradle.kts
          if grep -Fq '\n    id(' android/settings.gradle.kts; then
            echo "Literal backslash-n found in settings.gradle.kts"
            exit 1
          fi
          if grep -Fq '\n    id(' android/app/build.gradle.kts; then
            echo "Literal backslash-n found in build.gradle.kts"
            exit 1
          fi
      - name: Remove template counter widget test
        run: rm -f test/widget_test.dart
      - name: Install Flutter packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=KASA_PORTAL_URL=https://kasaschool.vercel.app
      - name: Assert packaged Android application ID
        run: |
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt_bin"
          "$aapt_bin" dump badging build/app/outputs/flutter-apk/app-debug.apk | grep -F "package: name='com.pamtech.kasa'"
      - uses: actions/upload-artifact@v4
        with:
          name: kasa-mobile-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
 android/settings.gradle.kts
          grep -q '^    id("com.google.gms.google-services")
      - name: Remove template counter widget test
        run: rm -f test/widget_test.dart
      - name: Install Flutter packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=KASA_PORTAL_URL=https://kasaschool.vercel.app
      - name: Assert packaged Android application ID
        run: |
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt_bin"
          "$aapt_bin" dump badging build/app/outputs/flutter-apk/app-debug.apk | grep -F "package: name='com.pamtech.kasa'"
      - uses: actions/upload-artifact@v4
        with:
          name: kasa-mobile-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
 android/app/build.gradle.kts
          # Fail if Dart accidentally emits literal backslash-n into Gradle Kotlin DSL.
          ! grep -Fq '\n    id(' android/settings.gradle.kts
          ! grep -Fq '\n    id(' android/app/build.gradle.kts
      - name: Remove template counter widget test
        run: rm -f test/widget_test.dart
      - name: Install Flutter packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=KASA_PORTAL_URL=https://kasaschool.vercel.app
      - name: Assert packaged Android application ID
        run: |
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt_bin"
          "$aapt_bin" dump badging build/app/outputs/flutter-apk/app-debug.apk | grep -F "package: name='com.pamtech.kasa'"
      - uses: actions/upload-artifact@v4
        with:
          name: kasa-mobile-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
