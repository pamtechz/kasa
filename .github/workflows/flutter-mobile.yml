name: Flutter mobile verification
on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8
        with:
          channel: stable
          cache: true
      - name: Generate Android runner
        run: flutter create --platforms=android --org com.pamtech --project-name kasa_mobile .
      - name: Configure Android permissions and package
        run: dart run tool/configure_android.dart
      - name: Verify exact Android package identity
        run: |
          grep -q 'applicationId = "com.pamtech.kasa"' android/app/build.gradle.kts
          grep -q 'namespace = "com.pamtech.kasa"' android/app/build.gradle.kts
          grep -q '^package com.pamtech.kasa$' android/app/src/main/kotlin/com/pamtech/kasa/MainActivity.kt
      - name: Remove template counter widget test
        run: rm -f test/widget_test.dart
      - name: Install Flutter packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug Android APK
        run: flutter build apk --debug --dart-define=KASA_PORTAL_URL=https://kasaschool.vercel.app
      - name: Assert packaged Android application ID
        run: |
          aapt_bin=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)
          test -n "$aapt_bin"
          "$aapt_bin" dump badging build/app/outputs/flutter-apk/app-debug.apk | grep -F "package: name='com.pamtech.kasa'"
      - uses: actions/upload-artifact@v4
        with:
          name: kasa-mobile-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
