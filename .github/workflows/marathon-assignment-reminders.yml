name: KASA Marathon afternoon and evening reminders

on:
  schedule:
    # 13:00 and 18:00 Africa/Lusaka (UTC+02:00). Schedule may start late.
    - cron: '0 11,16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kasa-marathon-reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger protected production reminder endpoint
        env:
          CRON_SECRET: ${{ secrets.KASA_MARATHON_CRON_SECRET }}
          REMINDER_URL: https://kasaschool.vercel.app/api/cron/marathon-reminders
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "Missing KASA_MARATHON_CRON_SECRET; set it to the same value as Vercel's production CRON_SECRET."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 10 --max-time 70 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${REMINDER_URL}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') is True, 'Reminder endpoint did not confirm success'; print({k:d.get(k) for k in ('ok','slot','actions','recipients','delivered','failed','alreadyProcessed','skipped') if k in d})"
